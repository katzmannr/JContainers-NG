name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: >
          cmake -B build
          -S .
          -A x64

      - name: Build
        run: >
          cmake --build build
          --config Release
          --parallel
